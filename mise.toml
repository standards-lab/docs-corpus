# The corpus' tools and its tasks.
# See docs/coverage.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
jq = "1.8.2"
go = "1.27.4"
golangci-lint = "2.15.0"
"conda:poppler" = "26.11.0"
"conda:qpdf" = "12.4.2"
"conda:ffmpeg" = "9.1.0"
"github:ImageMagick/ImageMagick" = { version = "7.1.2-36", asset_pattern = "ImageMagick-*-portable-Q16-HDRI-linux-x64.tar.xz" }
"conda:uchardet" = "0.0.8"
"conda:libarchive" = "3.8.11"

[tasks.check]
description = "Run scripts/check.sh: build, vet, format, fix, tidy, test, and lint the tools/coverage module, then check the manifest and the coverage data, and run lint-context and lint-references; writes nothing but Go's caches"
run = "scripts/check.sh"

[tasks.place-traits]
description = "Print every ~/docs sample's trait and feature placement with tools/coverage's place-traits; --facts adds the probes' findings"
run = "go run ./tools/coverage/cmd/place-traits"
