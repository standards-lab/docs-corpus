# The corpus' tools and its tasks.
# See docs/coverage.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
jq = "1.8.2"
go = "1.27.4"
golangci-lint = "2.15.0"
"conda:poppler" = "26.11.0"
"conda:qpdf" = "12.4.2"
"conda:ffmpeg" = "9.1.0"
"github:ImageMagick/ImageMagick" = { version = "7.1.2-36", asset_pattern = "ImageMagick-*-portable-Q16-HDRI-linux-x64.tar.xz" }
"conda:uchardet" = "0.0.8"
"conda:libarchive" = "3.8.11"

[tasks.check]
description = "Run scripts/check.sh: build, vet, format, fix, tidy, test, and lint the tools/coverage module, then check the manifest and the coverage data, and run lint-context and lint-references; writes nothing but Go's caches"
run = "scripts/check.sh"

[tasks.place-traits]
description = "Print every ~/docs sample's trait and feature placement with tools/coverage's place-traits; --facts adds the probes' findings, and --corpus prints the covers of every sample MANIFEST.json lists, placed from docproc's run over the corpus"
run = "go run ./tools/coverage/cmd/place-traits"

[tasks.dispose]
description = "Print docs/coverage.json with every sample's disposition derived by tools/coverage's dispose; --placement <file> takes the traits and features from a place-traits output first"
run = "go run ./tools/coverage/cmd/dispose"

[tasks.manifest]
description = "Print MANIFEST.json from docs/coverage.json, docs/license-readings.json, and ~/docs' manifest with tools/coverage's manifest; --copy first copies every file it lists from ~/docs into place"
run = "go run ./tools/coverage/cmd/manifest"

[tasks.pack]
description = "Write one uncompressed tar per format area, <area>.tar, of the sample files MANIFEST.json lists into the directory given, with scripts/pack.sh; fails if a file differs from MANIFEST.json or a tar reaches 2 GiB"
run = "scripts/pack.sh"

[tasks.fetch]
description = "Fetch every format area's <area>.tar from a release URL or a directory mise run pack wrote, with scripts/fetch.sh, and place the sample files at their manifest paths once each matches MANIFEST.json's size and sha256"
run = "scripts/fetch.sh"

[tasks.fetch-candidates]
description = "Fetch every sourced gap candidate in docs/coverage.json from its pinned URL to <area>/<source>/<name> with scripts/fetch-candidates.sh, verifying each against docs/candidates.json and recording any it doesn't list yet"
run = "scripts/fetch-candidates.sh"
