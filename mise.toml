# The corpus' tools and the task that checks it.
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.24.0", version_prefix = "marathon/v" }
jq = "1.8.2"

[tasks.check]
description = "Verify every file against MANIFEST.json, flag duplicate scenarios, validate docs/coverage.json's vocabulary and covers IDs, and run lint-context and lint-references; reads no network, writes nothing"
run = "scripts/check.sh"
